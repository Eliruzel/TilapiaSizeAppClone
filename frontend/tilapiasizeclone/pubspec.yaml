# Project information.
name: tilapiasizeclone
description: "A tilapia size grading application."
publish_to: 'none'
version: 1.0.0+1

# Dart SDK version.
environment:
  sdk: ^3.13.5

# Packages used by the app.
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0

# Packages used during development.
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Settings for the TilapiaSize app icon.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_logo.png"

# Flutter settings.
flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
